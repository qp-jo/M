<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر العطور الفاخرة</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            goldDark: '#AA8C2C',
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Google Font (Tajawal) -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .card-hover { transition: all 0.3s ease; }
    .card-hover:hover { transform: translateY(-4px); box-shadow: 0 15px 30px -10px rgba(212, 175, 55, 0.25); }
    .tap-effect { transition: transform 0.1s ease; }
    .tap-effect:active { transform: scale(0.97); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 selection:bg-gold selection:text-slate-950">

  <!-- إعدادات المتجر (تحكم مركزي سهل لصاحب المحل) -->
  <script>
    const STORE_CONFIG = {
      storeName: "إكسير العطور",
      whatsappNumber: "962780576584", // رقم واتساب صاحب المحل
      currency: "د.أ",
      csvUrl: "https://docs.google.com/spreadsheets/d/1jF0ERUkkiGWKEhqjqyeaC36Utu0BduqQXrga2x96iYw/export?format=csv",
      defaultImage: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500"
    };
  </script>

  <!-- إشعارات التوست التفاعلية -->
  <div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- الهيدر العلوي -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-gold to-amber-200 flex items-center justify-center text-slate-950 font-black text-lg shadow">
          <i class="fas fa-crown"></i>
        </div>
        <div>
          <h1 id="brand-title" class="font-black text-sm md:text-base text-white tracking-wide">متجر العطور</h1>
          <p class="text-[10px] text-gold font-semibold">عطور أصلية ومضمونة</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- زر المفضلة -->
        <button onclick="toggleWishlistDrawer()" class="tap-effect relative bg-slate-800 hover:bg-slate-700 text-gold p-2.5 rounded-xl border border-slate-700 transition flex items-center justify-center text-xs" title="المفضلة">
          <i class="fas fa-heart text-sm"></i>
          <span id="wishlist-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white w-4 h-4 rounded-full text-[9px] flex items-center justify-center font-black hidden">0</span>
        </button>

        <!-- زر السلة -->
        <button onclick="toggleCartDrawer()" class="tap-effect relative bg-slate-800 hover:bg-slate-700 text-gold px-3.5 py-2.5 rounded-xl border border-slate-700 transition flex items-center gap-2 font-bold text-xs">
          <i class="fas fa-shopping-bag text-sm"></i>
          <span class="hidden sm:inline">السلة</span>
          <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-emerald-500 text-slate-950 w-4 h-4 rounded-full text-[9px] flex items-center justify-center font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- صندوق البحث والفلترة والترتيب -->
  <section class="max-w-7xl mx-auto px-4 pt-6 pb-5 my-3 rounded-3xl text-center bg-slate-900/40 border border-slate-800/80 mx-4 md:mx-auto w-[calc(100%-2rem)] shadow-lg">
    <h2 class="text-xl md:text-3xl font-black mb-2 text-white">روائح تخلد حضورك الراقي</h2>
    <p class="text-slate-400 text-xs max-w-md mx-auto mb-4">ابحث عن عطرك المفضل، صفه، واطلبه مباشرة.</p>
    
    <div class="max-w-xl mx-auto grid grid-cols-1 sm:grid-cols-3 gap-2 mb-4">
      <!-- البحث الذكي -->
      <div class="sm:col-span-2 relative">
        <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-400"><i class="fas fa-search text-xs"></i></span>
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="ابحث بالاسم، الوصف، الوسوم، أو اللون..." class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 pr-10 pl-4 text-xs text-white focus:outline-none focus:border-gold transition">
      </div>
      <!-- الترتيب -->
      <div>
        <select id="sort-select" onchange="handleSort()" class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 px-3 text-xs text-white focus:outline-none focus:border-gold transition">
          <option value="default">الترتيب الافتراضي</option>
          <option value="price-asc">السعر: من الأقل للأعلى</option>
          <option value="price-desc">السعر: من الأعلى للأقل</option>
        </select>
      </div>
    </div>

    <!-- التصنيفات الأفقية -->
    <div id="category-box" class="flex items-center gap-2 overflow-x-auto pb-1 hide-scrollbar justify-start sm:justify-center text-xs font-bold">
      <button onclick="filterCategory('الكل')" id="cat-btn-الكل" class="cat-btn tap-effect whitespace-nowrap bg-gold text-slate-950 px-3.5 py-2 rounded-xl transition shadow">✨ الكل</button>
    </div>
  </section>

  <!-- عرض المنتجات -->
  <main class="max-w-7xl mx-auto px-4 py-4 flex-grow w-full">
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-20 text-slate-400">
        <i class="fas fa-spinner fa-spin text-3xl text-gold mb-2"></i>
        <p class="text-xs">جاري تحميل المنتجات...</p>
      </div>
    </div>
  </main>

  <!-- سلة المشتريات (Drawer) -->
  <div id="cart-drawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end transition-opacity" onclick="toggleCartDrawer()">
    <div class="w-full max-w-md bg-slate-900 border-r border-slate-800 h-full p-5 flex flex-col justify-between shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
          <h3 class="text-sm font-black text-white flex items-center gap-1.5"><i class="fas fa-shopping-bag text-gold"></i> سلة المشتريات</h3>
          <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-white w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items-container" class="space-y-2.5 mb-4">
          <p class="text-center text-slate-500 text-xs py-8">السلة فارغة حالياً</p>
        </div>
      </div>
      <div class="border-t border-slate-800 pt-3 space-y-2.5">
        <div class="flex justify-between items-center text-sm font-bold">
          <span class="text-slate-300">المجموع الكلي:</span>
          <span id="cart-total" class="text-gold text-base font-black">0.00 د.أ</span>
        </div>
        <input type="text" id="cust-name" placeholder="الاسم الكريم" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-gold">
        <input type="tel" id="cust-phone" placeholder="رقم الهاتف (07XXXXXXXX)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-gold">
        <select id="cust-delivery" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-gold">
          <option value="استلام مباشر من المحل">استلام مباشر من المحل</option>
          <option value="توصيل ضمن العاصمة">توصيل ضمن العاصمة</option>
          <option value="توصيل المحافظات">توصيل لباقي المحافظات</option>
        </select>
        <button onclick="checkoutWhatsApp()" class="tap-effect w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
          <i class="fab fa-whatsapp text-base"></i> إرسال الطلب للواتساب
        </button>
      </div>
    </div>
  </div>

  <!-- قائمة المفضلة (Drawer) -->
  <div id="wishlist-drawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end transition-opacity" onclick="toggleWishlistDrawer()">
    <div class="w-full max-w-md bg-slate-900 border-r border-slate-800 h-full p-5 flex flex-col justify-between shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
          <h3 class="text-sm font-black text-white flex items-center gap-1.5"><i class="fas fa-heart text-rose-500"></i> قائمة المفضلة</h3>
          <button onclick="toggleWishlistDrawer()" class="text-slate-400 hover:text-white w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
        </div>
        <div id="wishlist-items-container" class="space-y-2.5">
          <p class="text-center text-slate-500 text-xs py-8">المفضلة فارغة</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 border-t border-slate-800 py-3 text-center text-[11px] text-slate-500">
    <p>جميع الحقوق محفوظة © <span id="footer-brand">متجر العطور</span> 2026</p>
  </footer>

  <!-- سكربت التشغيل البرمجي -->
  <script>
    let rawProducts = [];
    let categoriesList = ['الكل'];
    let activeCategory = 'الكل';
    let cart = JSON.parse(localStorage.getItem('store_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('store_wishlist')) || [];

    function showToast(msg, type = 'success') {
      const box = document.getElementById('toast-container');
      const t = document.createElement('div');
      t.className = `pointer-events-auto px-3.5 py-2.5 rounded-xl shadow-xl text-xs font-bold flex items-center gap-2 transition-all duration-300 transform translate-y-2 opacity-0 ${type === 'success' ? 'bg-emerald-500 text-slate-950' : 'bg-slate-800 text-white border border-slate-700'}`;
      t.innerHTML = `<i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-info-circle text-gold'}"></i> ${msg}`;
      box.appendChild(t);
      setTimeout(() => t.classList.remove('translate-y-2', 'opacity-0'), 20);
      setTimeout(() => {
        t.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => t.remove(), 300);
      }, 2500);
    }

    function initApp() {
      document.getElementById('brand-title').innerText = STORE_CONFIG.storeName;
      document.getElementById('footer-brand').innerText = STORE_CONFIG.storeName;

      Papa.parse(STORE_CONFIG.csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          const rows = res.data;
          if (!rows || rows.length === 0) {
            document.getElementById('products-grid').innerHTML = `<div class="col-span-full text-center py-16 text-amber-500 text-xs font-bold">لا توجد منتجات مسجلة في الجدول حالياً.</div>`;
            return;
          }

          rawProducts = [];
          const catSet = new Set(['الكل']);

          rows.forEach((row, idx) => {
            const clean = {};
            Object.keys(row).forEach(k => {
              clean[k.replace(/^\ufeff/, '').trim().toLowerCase()] = row[k];
            });

            const title = clean['title'] || clean['اسم المنتج'] || '';
            const price = clean['price'] || clean['السعر'] || '0';
            const image = clean['image'] || clean['الصورة'] || STORE_CONFIG.defaultImage;
            const desc = clean['description'] || clean['الوصف'] || '';
            const cat = clean['category'] || clean['التصنيف'] || 'عطور';
            const stockVal = clean['stock'] || clean['quantity'] || clean['الكمية'] || '1';
            const color = clean['color'] || clean['اللون'] || '';
            const size = clean['size'] || clean['المقاس'] || '';
            const tags = clean['tags'] || clean['الوسوم'] || '';

            if (!title) return;

            rawProducts.push({
              id: idx,
              title: title.trim(),
              price: parseFloat(price) || 0,
              image: (image && image.trim() !== '') ? image.trim() : STORE_CONFIG.defaultImage,
              description: desc.trim(),
              category: cat.trim(),
              stock: parseInt(stockVal) >= 0 ? parseInt(stockVal) : 1,
              color: color.trim(),
              size: size.trim(),
              tags: tags.trim()
            });

            catSet.add(cat.trim());
          });

          categoriesList = Array.from(catSet);
          buildCategoriesUI();
          applyFiltersAndSearch();
          syncUI();
        },
        error: function() {
          document.getElementById('products-grid').innerHTML = `<div class="col-span-full text-center py-16 text-rose-500 text-xs font-bold">تعذر تحميل بيانات الجدول. تأكد من إعدادات مشاركة الرابط (Anyone with the link can view).</div>`;
        }
      });
    }

    function buildCategoriesUI() {
      const box = document.getElementById('category-box');
      box.innerHTML = '';
      categoriesList.forEach(cat => {
        const active = cat === activeCategory;
        box.innerHTML += `
          <button onclick="filterCategory('${cat}')" id="cat-btn-${cat}" class="cat-btn tap-effect whitespace-nowrap ${active ? 'bg-gold text-slate-950 font-black shadow' : 'bg-slate-800 text-slate-300 border border-slate-700 font-bold'} px-3.5 py-2 rounded-xl transition text-xs">${cat === 'الكل' ? '✨ الكل' : cat}</button>
        `;
      });
    }

    function filterCategory(cat) {
      activeCategory = cat;
      buildCategoriesUI();
      applyFiltersAndSearch();
    }

    function handleSearch() {
      applyFiltersAndSearch();
    }

    function handleSort() {
      applyFiltersAndSearch();
    }

    function normalizeArabic(text) {
      if (!text) return '';
      return text.toString().toLowerCase()
        .replace(/[إأآا]/g, 'ا')
        .replace(/ة/g, 'ه')
        .replace(/ى/g, 'ي')
        .replace(/[\u064b-\u065f]/g, '');
    }

    function applyFiltersAndSearch() {
      const rawQuery = document.getElementById('search-input').value;
      const query = normalizeArabic(rawQuery);
      const sortType = document.getElementById('sort-select').value;

      let list = [...rawProducts];

      if (activeCategory !== 'الكل') {
        list = list.filter(p => p.category.toLowerCase() === activeCategory.toLowerCase());
      }

      if (query.trim() !== '') {
        const keywords = query.split(/\s+/);
        list = list.filter(p => {
          const searchableText = normalizeArabic(`${p.title} ${p.description} ${p.tags} ${p.color} ${p.size}`);
          return keywords.every(kw => searchableText.includes(kw));
        });
      }

      if (sortType === 'price-asc') {
        list.sort((a, b) => a.price - b.price);
      } else if (sortType === 'price-desc') {
        list.sort((a, b) => b.price - a.price);
      }

      renderProducts(list);
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-xs">لا توجد عطور مطابقة لبحثك أو خيارات التصفية.</div>`;
        return;
      }

      list.forEach(p => {
        const isFav = wishlist.some(w => w.id === p.id);
        const isOutOfStock = p.stock <= 0;

        grid.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex flex-col justify-between card-hover relative shadow-md">
            <button onclick="toggleWishlist(${p.id})" class="absolute top-2.5 left-2.5 z-10 w-7 h-7 rounded-full bg-slate-950/70 backdrop-blur border border-slate-800 flex items-center justify-center text-xs transition ${isFav ? 'text-rose-500' : 'text-slate-400 hover:text-white'}" title="المفضلة">
              <i class="fas fa-heart"></i>
            </button>
            <div>
              <div class="flex items-center justify-between mb-2">
                <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-gold/15 text-gold border border-gold/30">${p.category}</span>
                ${isOutOfStock ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30">نفذت الكمية</span>' : ''}
              </div>
              <div class="h-40 rounded-xl bg-slate-950 overflow-hidden mb-2.5 border border-slate-800 flex items-center justify-center relative group">
                <img src="${p.image}" alt="${p.title}" onerror="this.src='${STORE_CONFIG.defaultImage}'" class="w-full h-full object-cover">
                <!-- زر مشاركة واتساب سريع -->
                <button onclick="shareProductWhatsApp('${p.title}', ${p.price})" class="absolute bottom-2 left-2 bg-emerald-600/90 text-white w-7 h-7 rounded-lg flex items-center justify-center text-xs opacity-0 group-hover:opacity-100 transition shadow" title="مشاركة العطر عبر واتساب">
                  <i class="fab fa-whatsapp"></i>
                </button>
              </div>
              <h3 class="font-bold text-xs text-white mb-1 line-clamp-1">${p.title}</h3>
              <p class="text-[11px] text-slate-300 leading-relaxed mb-3 line-clamp-2">${p.description}</p>
            </div>
            <div>
              <div class="flex items-center justify-between mb-2">
                <div class="text-sm font-black text-gold">${p.price} <span class="text-[10px] text-slate-400 font-normal">${STORE_CONFIG.currency}</span></div>
                ${p.size ? `<span class="text-[10px] text-slate-400 font-semibold">${p.size}</span>` : ''}
              </div>
              ${isOutOfStock ? `
                <button disabled class="w-full bg-slate-800 text-slate-500 font-bold py-2 rounded-xl text-xs cursor-not-allowed">نفذت الكمية</button>
              ` : `
                <button onclick="addToCart(${p.id})" class="tap-effect w-full bg-gold hover:bg-goldDark text-slate-950 font-black py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                  <i class="fas fa-cart-plus"></i> أضف للسلة
                </button>
              `}
            </div>
          </div>`;
      });
    }

    function shareProductWhatsApp(title, price) {
      const text = `مرحباً، أعجبني هذا العطر:%0A*${title}*%0Aالسعر: ${price} ${STORE_CONFIG.currency}%0Aهل هو متوفر لديكم؟`;
      window.open(`https://wa.me/${STORE_CONFIG.whatsappNumber}?text=${text}`, '_blank');
    }

    function toggleCartDrawer() {
      document.getElementById('cart-drawer').classList.toggle('hidden');
    }

    function addToCart(id) {
      const p = rawProducts.find(x => x.id === id);
      if (!p || p.stock <= 0) return;
      const exist = cart.find(x => x.id === id);
      if (exist) {
        if (exist.qty < p.stock) exist.qty++;
        else {
          showToast("عذراً، وصلت للحد الأقصى للكمية المتوفرة بالمخزون", "info");
          return;
        }
      } else {
        cart.push({ ...p, qty: 1 });
      }

      saveData();
      syncUI();
      showToast(`تمت إضافة "${p.title}" للسلة`);
    }

    function changeQty(id, delta) {
      const p = rawProducts.find(x => x.id === id);
      const item = cart.find(x => x.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty > p.stock) {
        item.qty = p.stock;
        showToast("الكمية المطلوبة تتجاوز المخزون المتوفر", "info");
      }
      if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
      saveData();
      syncUI();
    }

    function toggleWishlistDrawer() {
      document.getElementById('wishlist-drawer').classList.toggle('hidden');
    }

    function toggleWishlist(id) {
      const p = rawProducts.find(x => x.id === id);
      const idx = wishlist.findIndex(w => w.id === id);
      if (idx > -1) {
        wishlist.splice(idx, 1);
        showToast("تمت الإزالة من المفضلة", "info");
      } else {
        wishlist.push(p);
        showToast("تمت الإضافة للمفضلة ❤️");
      }

      saveData();
      syncUI();
      applyFiltersAndSearch();
    }

    function saveData() {
      localStorage.setItem('store_cart', JSON.stringify(cart));
      localStorage.setItem('store_wishlist', JSON.stringify(wishlist));
    }

    function syncUI() {
      const cartBadge = document.getElementById('cart-badge');
      const wishBadge = document.getElementById('wishlist-badge');

      const totalCart = cart.reduce((s, i) => s + i.qty, 0);
      cartBadge.innerText = totalCart;

      if (wishlist.length > 0) {
        wishBadge.innerText = wishlist.length;
        wishBadge.classList.remove('hidden');
      } else {
        wishBadge.classList.add('hidden');
      }

      const cartBox = document.getElementById('cart-items-container');
      const totalBox = document.getElementById('cart-total');

      if (cart.length === 0) {
        cartBox.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">السلة فارغة حالياً</p>`;
        totalBox.innerText = `0.00 ${STORE_CONFIG.currency}`;
      } else {
        cartBox.innerHTML = '';
        let sum = 0;
        cart.forEach(i => {
          sum += i.price * i.qty;
          cartBox.innerHTML += `
            <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs gap-2">
              <div class="flex items-center gap-2 flex-1">
                <img src="${i.image}" onerror="this.src='${STORE_CONFIG.defaultImage}'" class="w-9 h-9 rounded-lg object-cover">
                <div>
                  <h5 class="font-bold text-white line-clamp-1">${i.title}</h5>
                  <p class="text-gold font-bold">${i.price} ${STORE_CONFIG.currency}</p>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="changeQty(${i.id}, -1)" class="w-5 h-5 bg-slate-800 text-white rounded flex items-center justify-center font-bold text-xs">-</button>
                <span class="font-black w-4 text-center text-xs">${i.qty}</span>
                <button onclick="changeQty(${i.id}, 1)" class="w-5 h-5 bg-slate-800 text-white rounded flex items-center justify-center font-bold text-xs">+</button>
              </div>
            </div>`;
        });
        totalBox.innerText = `${sum.toFixed(2)} ${STORE_CONFIG.currency}`;
      }

      const wishBox = document.getElementById('wishlist-items-container');
      if (wishlist.length === 0) {
        wishBox.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">المفضلة فارغة</p>`;
      } else {
        wishBox.innerHTML = '';
        wishlist.forEach(i => {
          wishBox.innerHTML += `
            <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs gap-2">
              <div class="flex items-center gap-2 flex-1">
                <img src="${i.image}" onerror="this.src='${STORE_CONFIG.defaultImage}'" class="w-9 h-9 rounded-lg object-cover">
                <div>
                  <h5 class="font-bold text-white line-clamp-1">${i.title}</h5>
                  <p class="text-gold font-bold">${i.price} ${STORE_CONFIG.currency}</p>
                </div>
              </div>
              <button onclick="addToCart(${i.id}); toggleWishlistDrawer(); toggleCartDrawer();" class="bg-gold text-slate-950 font-bold px-2.5 py-1 rounded-lg text-xs">شراء</button>
            </div>`;
        });
      }
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) {
        showToast("السلة فارغة!", "info");
        return;
      }
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const delivery = document.getElementById('cust-delivery').value;

      if (!name || !phone) {
        showToast("الرجاء إدخال الاسم ورقم الهاتف لإتمام الطلب.", "info");
        return;
      }

      const jordanPhoneRegex = /^07[789]\d{7}$/;
      if (!jordanPhoneRegex.test(phone)) {
        showToast("رقم الهاتف غير صحيح. يجب أن يكون رقماً أردنياً صحيحاً (مثال: 0791234567)", "info");
        return;
      }

      let msg = `طلب جديد من المتجر 👑%0A- الاسم: ${name}%0A- الهاتف: ${phone}%0A- طريقة الاستلام: ${delivery}%0A------------------%0Aالمنتجات المطلوبة:%0A`;
      let total = 0;

      cart.forEach((i, idx) => {
        const sub = i.price * i.qty;
        total += sub;
        msg += `${idx + 1}. ${i.title} (الكمية: ${i.qty}) - ${sub} ${STORE_CONFIG.currency}%0A`;
      });

      msg += `------------------%0Aالمجموع الكلي: ${total.toFixed(2)} ${STORE_CONFIG.currency}`;

      window.open(`https://wa.me/${STORE_CONFIG.whatsappNumber}?text=${msg}`, '_blank');
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
