<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إكسير العطور | متجر العطور الفاخرة</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            goldDark: '#AA8C2C',
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Google Font (Tajawal) -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .card-hover { transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1); }
    .card-hover:hover { transform: translateY(-6px); box-shadow: 0 15px 30px -10px rgba(212, 175, 55, 0.25); }
    .click-scale { transition: transform 0.15s ease; }
    .click-scale:active { transform: scale(0.95); }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between pb-24 md:pb-0 bg-slate-950 text-slate-100">

  <!-- الهيدر -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-lg">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-gold to-amber-200 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg">
          <i class="fas fa-spray-can-sparkles"></i>
        </div>
        <div>
          <h1 class="font-black text-lg text-white">إكسير العطور</h1>
          <p class="text-[11px] text-gold font-semibold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> متصل بـ Google Sheets بنجاح
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="toggleCartDrawer()" class="click-scale relative bg-slate-800 hover:bg-slate-700 text-gold px-4 py-2.5 rounded-xl border border-slate-700 text-xs font-bold flex items-center gap-2">
          <i class="fas fa-shopping-bag text-sm"></i>
          <span>السلة</span>
          <span id="cart-badge" class="absolute -top-2 -right-2 bg-emerald-500 text-slate-950 w-5 h-5 rounded-full text-[10px] flex items-center justify-center font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- الهيرو والبحث -->
  <section class="border border-slate-800 max-w-7xl mx-auto px-4 pt-8 pb-6 my-4 rounded-3xl text-center bg-slate-900/60 shadow-xl mx-4 md:mx-auto w-[calc(100%-2rem)]">
    <h2 class="text-2xl md:text-4xl font-black mb-2 text-white">روائح تخلد حضورك الراقي</h2>
    <p class="text-slate-400 text-xs max-w-xl mx-auto mb-4">المنتجات تُسحب فوراً من جدولك المخصص.</p>
    
    <div class="max-w-md mx-auto relative">
      <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fas fa-search"></i></span>
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="ابحث عن العطر..." class="w-full bg-slate-800 border border-slate-700 rounded-xl py-3 pr-11 pl-4 text-xs text-white focus:outline-none focus:border-gold">
    </div>
  </section>

  <!-- شبكة العروض والمنتجات -->
  <main class="max-w-7xl mx-auto px-4 py-4 flex-grow w-full">
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="col-span-full text-center py-20 text-slate-400">
        <i class="fas fa-spinner fa-spin text-3xl text-gold mb-2"></i>
        <p class="text-xs">جاري جلب وعرض البيانات من جدولك...</p>
      </div>
    </div>
  </main>

  <!-- سلة التسوق -->
  <div id="cart-drawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end" onclick="toggleCartDrawer()">
    <div class="w-full max-w-md bg-slate-900 border-r border-slate-800 h-full p-6 flex flex-col justify-between shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
          <h3 class="text-base font-black text-white"><i class="fas fa-shopping-bag text-gold ml-1"></i> سلة المشتريات</h3>
          <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-white w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items" class="space-y-3 mb-6">
          <p class="text-center text-slate-500 text-xs py-8">السلة فارغة</p>
        </div>
      </div>
      <div class="border-t border-slate-800 pt-4 space-y-3">
        <div class="flex justify-between items-center text-sm font-bold">
          <span class="text-slate-300">المجموع:</span>
          <span id="cart-total" class="text-gold text-lg font-black">0.00 د.أ</span>
        </div>
        <input type="text" id="cust-name" placeholder="اسم العميل" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-gold">
        <input type="tel" id="cust-phone" placeholder="رقم الهاتف (07XXXXXXXX)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-gold">
        <button onclick="checkout()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
          <i class="fab fa-whatsapp text-base"></i> إرسال الطلب عبر الواتساب
        </button>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-[11px] text-slate-500">
    <p>جميع الحقوق محفوظة © إكسير العطور 2026</p>
  </footer>

  <script>
    // رابط جدولك الجديد تماماً
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1jF0ERUkkiGWKEhqjqyeaC36Utu0BduqQXrga2x96iYw/export?format=csv';
    let products = [];
    let cart = [];

    function loadSheetData() {
      const grid = document.getElementById('products-grid');

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const rawRows = results.data;
          
          if (!rawRows || rawRows.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-16 text-amber-500 text-xs font-bold">الجدول فارغ! تأكد من إضافة بيانات في الجدول.</div>`;
            return;
          }

          products = [];
          rawRows.forEach((row, index) => {
            // تنظيف أسماء الأعمدة من الحروف المخفية مثل BOM
            const cleanRow = {};
            Object.keys(row).forEach(k => {
              const cleanKey = k.replace(/^\ufeff/, '').trim().toLowerCase();
              cleanRow[cleanKey] = row[k];
            });

            const title = cleanRow['title'] || cleanRow['اسم المنتج'] || '';
            const price = cleanRow['price'] || cleanRow['السعر'] || '0';
            const image = cleanRow['image'] || cleanRow['الصورة'] || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500';
            const description = cleanRow['description'] || cleanRow['الوصف'] || '';
            const category = cleanRow['category'] || cleanRow['التصنيف'] || 'عطور';

            if (!title) return;

            products.push({
              id: index,
              title: title.trim(),
              price: parseFloat(price) || 0,
              image: image.trim(),
              description: description.trim(),
              category: category.trim()
            });
          });

          renderProducts(products);
        },
        error: function(err) {
          grid.innerHTML = `
            <div class="col-span-full text-center py-16 text-rose-500 text-xs font-bold space-y-2">
              <p>تعذر قراءة الجدول. تأكد من أن إعدادات المشاركة في Google Sheets مضبوطة على:</p>
              <p class="text-white bg-slate-900 p-2 rounded border border-slate-800">"Anyone with the link can view" (أو أي شخص لديه الرابط يمكنه العرض)</p>
            </div>`;
        }
      });
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-xs">لا توجد عطور مطابقة لبحثك.</div>`;
        return;
      }

      list.forEach(item => {
        grid.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between card-hover shadow-md">
            <div>
              <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-gold/20 text-gold border border-gold/30 inline-block mb-3">${item.category}</span>
              <div class="h-44 rounded-xl bg-slate-950 overflow-hidden mb-3 border border-slate-800 flex items-center justify-center">
                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
              </div>
              <h3 class="font-bold text-sm text-white mb-1">${item.title}</h3>
              <p class="text-[11px] text-slate-300 leading-relaxed mb-4 line-clamp-2">${item.description}</p>
            </div>
            <div>
              <div class="text-lg font-black text-gold mb-3">${item.price} <span class="text-[10px] text-slate-400 font-normal">د.أ</span></div>
              <button onclick="addToCart(${item.id})" class="click-scale w-full bg-gold hover:bg-goldDark text-slate-950 font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                <i class="fas fa-cart-plus"></i> أضف للسلة
              </button>
            </div>
          </div>`;
      });
    }

    function handleSearch() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = products.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
      renderProducts(filtered);
    }

    function toggleCartDrawer() {
      document.getElementById('cart-drawer').classList.toggle('hidden');
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      const exist = cart.find(x => x.id === id);
      if (exist) exist.qty++;
      else cart.push({ ...p, qty: 1 });
      updateCartUI();
      toggleCartDrawer();
    }

    function updateCartUI() {
      const badge = document.getElementById('cart-badge');
      const container = document.getElementById('cart-items');
      const totalEl = document.getElementById('cart-total');

      const count = cart.reduce((s, i) => s + i.qty, 0);
      badge.innerText = count;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">السلة فارغة</p>`;
        totalEl.innerText = "0.00 د.أ";
        return;
      }

      container.innerHTML = '';
      let sum = 0;
      cart.forEach(item => {
        sum += item.price * item.qty;
        container.innerHTML += `
          <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs">
            <span class="font-bold text-white line-clamp-1 flex-1">${item.title} (${item.qty})</span>
            <span class="text-gold font-bold mr-2">${(item.price * item.qty).toFixed(2)} د.أ</span>
          </div>`;
      });
      totalEl.innerText = sum.toFixed(2) + " د.أ";
    }

    function checkout() {
      if (cart.length === 0) { alert("السلة فارغة!"); return; }
      const name = document.getElementById('cust-name').value;
      const phone = document.getElementById('cust-phone').value;
      if (!name || !phone) { alert("الرجاء إدخال الاسم ورقم الهاتف."); return; }

      let msg = `طلب جديد:%0A- الاسم: ${name}%0A- الهاتف: ${phone}%0A------------------%0A`;
      let sum = 0;
      cart.forEach((i, idx) => {
        sum += i.price * i.qty;
        msg += `${idx + 1}. ${i.title} (الكمية: ${i.qty}) - ${i.price * i.qty} د.أ%0A`;
      });
      msg += `------------------%0Aالمجموع: ${sum.toFixed(2)} د.أ`;

      window.open(`https://wa.me/962780576584?text=${msg}`, '_blank');
    }

    window.addEventListener('DOMContentLoaded', loadSheetData);
  </script>
</body>
</html>
