<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر العطور الفاخرة</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gold: '#D4AF37',
            goldDark: '#AA8C2C',
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Google Font (Tajawal) -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .card-transition { transition: all 0.3s ease; }
    .card-transition:hover { transform: translateY(-5px); box-shadow: 0 12px 25px -10px rgba(212, 175, 55, 0.2); }
    .btn-scale { transition: transform 0.1s ease; }
    .btn-scale:active { transform: scale(0.96); }
    /* إخفاء شريط التمرير */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 selection:bg-gold selection:text-slate-950">

  <!-- الهيدر العلوي -->
  <header class="sticky top-0 z-40 bg-slate-900/95 backdrop-blur-md border-b border-slate-800 px-4 py-3.5 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-gold to-amber-200 flex items-center justify-center text-slate-950 font-black text-lg shadow">
          <i class="fas fa-crown"></i>
        </div>
        <div>
          <h1 class="font-black text-base md:text-lg text-white tracking-wide">إكسير العطور</h1>
          <p class="text-[10px] text-gold font-semibold">عطور أصلية وفاخرة</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- زر المفضلة -->
        <button onclick="toggleWishlistDrawer()" class="btn-scale relative bg-slate-800 hover:bg-slate-700 text-gold p-2.5 rounded-xl border border-slate-700 transition flex items-center justify-center text-xs" title="المفضلة">
          <i class="fas fa-heart text-sm"></i>
          <span id="wishlist-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white w-4 h-4 rounded-full text-[9px] flex items-center justify-center font-black hidden">0</span>
        </button>

        <!-- زر السلة -->
        <button onclick="toggleCartDrawer()" class="btn-scale relative bg-slate-800 hover:bg-slate-700 text-gold px-3.5 py-2.5 rounded-xl border border-slate-700 transition flex items-center gap-2 font-bold text-xs">
          <i class="fas fa-shopping-bag text-sm"></i>
          <span class="hidden sm:inline">السلة</span>
          <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-emerald-500 text-slate-950 w-4 h-4 rounded-full text-[9px] flex items-center justify-center font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- الهيرو والبحث -->
  <section class="max-w-7xl mx-auto px-4 pt-8 pb-6 my-3 rounded-3xl text-center bg-slate-900/50 border border-slate-800/80 mx-4 md:mx-auto w-[calc(100%-2rem)] shadow-lg">
    <h2 class="text-2xl md:text-4xl font-black mb-2 text-white">روائح تخلد حضورك الراقي</h2>
    <p class="text-slate-400 text-xs max-w-lg mx-auto mb-5">تصفح تشكيلتنا الفاخرة واطلب عطرك المفضل بكل سهولة.</p>
    
    <div class="max-w-md mx-auto relative mb-4">
      <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fas fa-search text-xs"></i></span>
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="ابحث عن اسم العطر أو التصنيف..." class="w-full bg-slate-800/90 border border-slate-700 rounded-xl py-3 pr-11 pl-4 text-xs text-white focus:outline-none focus:border-gold transition shadow-inner">
    </div>

    <!-- أزرار التصنيفات -->
    <div id="category-buttons" class="flex items-center gap-2 overflow-x-auto pb-1 no-scrollbar justify-start sm:justify-center text-xs font-bold">
      <button onclick="filterCategory('الكل')" id="cat-btn-الكل" class="cat-btn btn-scale whitespace-nowrap bg-gold text-slate-950 px-4 py-2 rounded-xl transition shadow">✨ الكل</button>
      <button onclick="filterCategory('رجالي')" id="cat-btn-رجالي" class="cat-btn btn-scale whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl transition">👔 عطور رجالية</button>
      <button onclick="filterCategory('نسائي')" id="cat-btn-نسائي" class="cat-btn btn-scale whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl transition">🌸 عطور نسائية</button>
      <button onclick="filterCategory('للجنسين')" id="cat-btn-للجنسين" class="cat-btn btn-scale whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl transition">⚖️ للجنسين</button>
      <button onclick="filterCategory('نيش')" id="cat-btn-نيش" class="cat-btn btn-scale whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl transition">💎 عطور نيش</button>
    </div>
  </section>

  <!-- عرض المنتجات -->
  <main class="max-w-7xl mx-auto px-4 py-4 flex-grow w-full">
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      <div class="col-span-full text-center py-20 text-slate-400">
        <i class="fas fa-spinner fa-spin text-3xl text-gold mb-2"></i>
        <p class="text-xs">جاري تحميل المنتجات...</p>
      </div>
    </div>
  </main>

  <!-- سلة المشتريات (Drawer) -->
  <div id="cart-drawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end transition-opacity" onclick="toggleCartDrawer()">
    <div class="w-full max-w-md bg-slate-900 border-r border-slate-800 h-full p-5 flex flex-col justify-between shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
          <h3 class="text-sm font-black text-white flex items-center gap-1.5"><i class="fas fa-shopping-bag text-gold"></i> سلة المشتريات</h3>
          <button onclick="toggleCartDrawer()" class="text-slate-400 hover:text-white w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items-container" class="space-y-2.5 mb-5">
          <p class="text-center text-slate-500 text-xs py-8">السلة فارغة حالياً</p>
        </div>
      </div>
      <div class="border-t border-slate-800 pt-4 space-y-3">
        <div class="flex justify-between items-center text-sm font-bold">
          <span class="text-slate-300">المجموع الكلي:</span>
          <span id="cart-total" class="text-gold text-base font-black">0.00 د.أ</span>
        </div>
        <div class="space-y-2">
          <input type="text" id="cust-name" placeholder="الاسم الكريم" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-gold">
          <input type="tel" id="cust-phone" placeholder="رقم الهاتف (07XXXXXXXX)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-gold">
          <select id="cust-location" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-gold">
            <option value="استلام من المحل">استلام من المحل</option>
            <option value="توصيل عمان">توصيل عمان</option>
            <option value="توصيل المحافظات">توصيل لباقي المحافظات</option>
          </select>
        </div>
        <button onclick="checkoutWhatsApp()" class="btn-scale w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
          <i class="fab fa-whatsapp text-base"></i> إرسال الطلب عبر الواتساب
        </button>
      </div>
    </div>
  </div>

  <!-- قائمة المفضلة (Drawer) -->
  <div id="wishlist-drawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end transition-opacity" onclick="toggleWishlistDrawer()">
    <div class="w-full max-w-md bg-slate-900 border-r border-slate-800 h-full p-5 flex flex-col justify-between shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center mb-5 border-b border-slate-800 pb-3">
          <h3 class="text-sm font-black text-white flex items-center gap-1.5"><i class="fas fa-heart text-rose-500"></i> قائمة المفضلة</h3>
          <button onclick="toggleWishlistDrawer()" class="text-slate-400 hover:text-white w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
        </div>
        <div id="wishlist-items-container" class="space-y-2.5">
          <p class="text-center text-slate-500 text-xs py-8">المفضلة فارغة</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-[11px] text-slate-500">
    <p>جميع الحقوق محفوظة © إكسير العطور الفاخرة 2026</p>
  </footer>

  <script>
    // رابط جدولك الجديد تماماً
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/1jF0ERUkkiGWKEhqjqyeaC36Utu0BduqQXrga2x96iYw/export?format=csv';
    
    let products = [];
    let cart = JSON.parse(localStorage.getItem('elixir_cart')) || [];
    let wishlist = JSON.parse(localStorage.getItem('elixir_wishlist')) || [];
    let currentCategory = 'الكل';

    // تحميل البيانات من جوجل شيت
    function loadStoreData() {
      const grid = document.getElementById('products-grid');

      Papa.parse(CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          const rawRows = results.data;
          
          if (!rawRows || rawRows.length === 0) {
            grid.innerHTML = `<div class="col-span-full text-center py-16 text-amber-500 text-xs font-bold">عذراً، لا توجد منتجات معروضة حالياً.</div>`;
            return;
          }

          products = [];
          rawRows.forEach((row, index) => {
            const cleanRow = {};
            Object.keys(row).forEach(k => {
              const cleanKey = k.replace(/^\ufeff/, '').trim().toLowerCase();
              cleanRow[cleanKey] = row[k];
            });

            const title = cleanRow['title'] || cleanRow['اسم المنتج'] || '';
            const price = cleanRow['price'] || cleanRow['السعر'] || '0';
            const image = cleanRow['image'] || cleanRow['الصورة'] || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500';
            const description = cleanRow['description'] || cleanRow['الوصف'] || '';
            const category = cleanRow['category'] || cleanRow['التصنيف'] || 'رجالي';

            if (!title) return;

            products.push({
              id: index,
              title: title.trim(),
              price: parseFloat(price) || 0,
              image: image.trim(),
              description: description.trim(),
              category: category.trim()
            });
          });

          filterCategory('الكل');
          updateCartUI();
          updateWishlistUI();
        },
        error: function() {
          grid.innerHTML = `<div class="col-span-full text-center py-16 text-rose-500 text-xs font-bold">تعذر تحميل المنتجات، يرجى التحقق من اتصال الإنترنت.</div>`;
        }
      });
    }

    // عرض المنتجات
    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-xs">لا توجد عطور مطابقة لبحثك.</div>`;
        return;
      }

      list.forEach(item => {
        const isFav = wishlist.some(w => w.id === item.id);
        grid.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between card-transition relative shadow-md">
            <button onclick="toggleWishlist(${item.id})" class="absolute top-3 left-3 z-10 w-8 h-8 rounded-full bg-slate-950/70 backdrop-blur border border-slate-800 flex items-center justify-center text-xs transition ${isFav ? 'text-rose-500' : 'text-slate-400 hover:text-white'}">
              <i class="fas fa-heart"></i>
            </button>
            <div>
              <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-gold/15 text-gold border border-gold/30 inline-block mb-2.5">${item.category}</span>
              <div class="h-44 rounded-xl bg-slate-950 overflow-hidden mb-3 border border-slate-800 flex items-center justify-center">
                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover">
              </div>
              <h3 class="font-bold text-sm text-white mb-1 line-clamp-1">${item.title}</h3>
              <p class="text-[11px] text-slate-300 leading-relaxed mb-3 line-clamp-2">${item.description}</p>
            </div>
            <div>
              <div class="text-base font-black text-gold mb-2.5">${item.price} <span class="text-[10px] text-slate-400 font-normal">د.أ</span></div>
              <button onclick="addToCart(${item.id})" class="btn-scale w-full bg-gold hover:bg-goldDark text-slate-950 font-black py-2.5 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                <i class="fas fa-cart-plus"></i> أضف للسلة
              </button>
            </div>
          </div>`;
      });
    }

    // الفلترة والتصنيفات
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.className = "cat-btn btn-scale whitespace-nowrap bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2 rounded-xl transition text-xs font-bold";
      });
      const activeBtn = document.getElementById(`cat-btn-${cat}`);
      if (activeBtn) activeBtn.className = "cat-btn btn-scale whitespace-nowrap bg-gold text-slate-950 px-4 py-2 rounded-xl transition text-xs font-black shadow";

      applyFiltersAndSearch();
    }

    function handleSearch() {
      applyFiltersAndSearch();
    }

    function applyFiltersAndSearch() {
      const query = document.getElementById('search-input').value.toLowerCase();
      let filtered = products;

      if (currentCategory !== 'الكل') {
        filtered = filtered.filter(p => p.category.toLowerCase().includes(currentCategory.toLowerCase()));
      }

      if (query.trim() !== '') {
        filtered = filtered.filter(p => p.title.toLowerCase().includes(query) || p.description.toLowerCase().includes(query));
      }

      renderProducts(filtered);
    }

    // إدارة السلة مع التخزين المحلي (LocalStorage)
    function toggleCartDrawer() {
      document.getElementById('cart-drawer').classList.toggle('hidden');
    }

    function addToCart(id) {
      const p = products.find(x => x.id === id);
      const exist = cart.find(x => x.id === id);
      if (exist) exist.qty++;
      else cart.push({ ...p, qty: 1 });
      
      saveCart();
      updateCartUI();
      toggleCartDrawer();
    }

    function updateCartQty(id, change) {
      const item = cart.find(x => x.id === id);
      if (!item) return;
      item.qty += change;
      if (item.qty <= 0) cart = cart.filter(x => x.id !== id);
      saveCart();
      updateCartUI();
    }

    function saveCart() {
      localStorage.setItem('elixir_cart', JSON.stringify(cart));
    }

    function updateCartUI() {
      const badge = document.getElementById('cart-badge');
      const container = document.getElementById('cart-items-container');
      const totalEl = document.getElementById('cart-total');

      const count = cart.reduce((s, i) => s + i.qty, 0);
      badge.innerText = count;

      if (cart.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">السلة فارغة حالياً</p>`;
        totalEl.innerText = "0.00 د.أ";
        return;
      }

      container.innerHTML = '';
      let sum = 0;
      cart.forEach(item => {
        sum += item.price * item.qty;
        container.innerHTML += `
          <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs gap-2">
            <div class="flex items-center gap-2.5 flex-1">
              <img src="${item.image}" class="w-10 h-10 rounded-lg object-cover">
              <div>
                <h5 class="font-bold text-white line-clamp-1">${item.title}</h5>
                <p class="text-gold font-bold">${item.price} د.أ</p>
              </div>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="updateCartQty(${item.id}, -1)" class="w-6 h-6 bg-slate-800 text-white rounded-lg flex items-center justify-center font-bold text-xs">-</button>
              <span class="font-black w-4 text-center text-xs">${item.qty}</span>
              <button onclick="updateCartQty(${item.id}, 1)" class="w-6 h-6 bg-slate-800 text-white rounded-lg flex items-center justify-center font-bold text-xs">+</button>
            </div>
          </div>`;
      });
      totalEl.innerText = sum.toFixed(2) + " د.أ";
    }

    // إدارة المفضلة مع التخزين المحلي (LocalStorage)
    function toggleWishlistDrawer() {
      document.getElementById('wishlist-drawer').classList.toggle('hidden');
    }

    function toggleWishlist(id) {
      const p = products.find(x => x.id === id);
      const index = wishlist.findIndex(w => w.id === id);
      if (index > -1) wishlist.splice(index, 1);
      else wishlist.push(p);

      localStorage.setItem('elixir_wishlist', JSON.stringify(wishlist));
      updateWishlistUI();
      applyFiltersAndSearch();
    }

    function updateWishlistUI() {
      const badge = document.getElementById('wishlist-badge');
      const container = document.getElementById('wishlist-items-container');

      if (wishlist.length > 0) {
        badge.innerText = wishlist.length;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      if (wishlist.length === 0) {
        container.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">المفضلة فارغة</p>`;
        return;
      }

      container.innerHTML = '';
      wishlist.forEach(item => {
        container.innerHTML += `
          <div class="flex items-center justify-between bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-xs gap-2">
            <div class="flex items-center gap-2.5 flex-1">
              <img src="${item.image}" class="w-10 h-10 rounded-lg object-cover">
              <div>
                <h5 class="font-bold text-white line-clamp-1">${item.title}</h5>
                <p class="text-gold font-bold">${item.price} د.أ</p>
              </div>
            </div>
            <button onclick="addToCart(${item.id}); toggleWishlistDrawer(); toggleCartDrawer();" class="bg-gold text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs">شراء</button>
          </div>`;
      });
    }

    function checkoutWhatsApp() {
      if (cart.length === 0) { alert("السلة فارغة!"); return; }
      const name = document.getElementById('cust-name').value.trim();
      const phone = document.getElementById('cust-phone').value.trim();
      const location = document.getElementById('cust-location').value;

      if (!name || !phone) { alert("الرجاء إدخال الاسم ورقم الهاتف."); return; }

      let msg = `طلب جديد من المتجر 👑%0A- الاسم: ${name}%0A- الهاتف: ${phone}%0A- طريقة الاستلام: ${location}%0A------------------%0Aالمنتجات المطلوبة:%0A`;
      let sum = 0;
      cart.forEach((i, idx) => {
        sum += i.price * i.qty;
        msg += `${idx + 1}. ${i.title} (الكمية: ${i.qty}) - ${i.price * i.qty} د.أ%0A`;
      });
      msg += `------------------%0Aالمجموع الكلي: ${sum.toFixed(2)} د.أ`;

      window.open(`https://wa.me/962780576584?text=${msg}`, '_blank');
    }

    window.addEventListener('DOMContentLoaded', loadStoreData);
  </script>
</body>
</html>
