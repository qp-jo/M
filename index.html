<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>متجر العطور الفاخرة</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#D4AF37',
            primaryDark: '#AA8C2C',
          }
        }
      }
    }
  </script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  
  <!-- Google Font (Tajawal) -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Tajawal', sans-serif; }
    .transition-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    .transition-card:hover { transform: translateY(-5px); box-shadow: 0 15px 30px -10px rgba(212, 175, 55, 0.15); }
    .tap-effect { transition: transform 0.1s ease; }
    .tap-effect:active { transform: scale(0.97); }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-100 selection:bg-primary selection:text-slate-950">

  <!-- إعدادات المتجر والتحكم البرمجي -->
  <script>
    const STORE_CONFIG = {
      name: "إكسير العطور",
      tagline: "عطور أصلية وخلابة",
      whatsapp: "962780576584", // رقم واتساب صاحب المحل
      currency: "د.أ",
      csvUrl: "https://docs.google.com/spreadsheets/d/1jF0ERUkkiGWKEhqjqyeaC36Utu0BduqQXrga2x96iYw/export?format=csv"
    };
  </script>

  <!-- الهيدر العلوي -->
  <header class="sticky top-0 z-40 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-md">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-primary to-amber-200 flex items-center justify-center text-slate-950 font-black text-lg shadow">
          <i class="fas fa-crown"></i>
        </div>
        <div>
          <h1 id="store-title" class="font-black text-sm md:text-base text-white tracking-wide">إكسير العطور</h1>
          <p class="text-[10px] text-primary font-semibold">متجر معتمد</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <!-- زر المفضلة -->
        <button onclick="toggleWishlistModal()" class="tap-effect relative bg-slate-800 hover:bg-slate-700 text-primary p-2.5 rounded-xl border border-slate-700 transition flex items-center justify-center text-xs" title="المفضلة">
          <i class="fas fa-heart text-sm"></i>
          <span id="wishlist-badge" class="absolute -top-1.5 -right-1.5 bg-rose-500 text-white w-4 h-4 rounded-full text-[9px] flex items-center justify-center font-black hidden">0</span>
        </button>

        <!-- زر السلة -->
        <button onclick="toggleCartModal()" class="tap-effect relative bg-slate-800 hover:bg-slate-700 text-primary px-3.5 py-2.5 rounded-xl border border-slate-700 transition flex items-center gap-2 font-bold text-xs">
          <i class="fas fa-shopping-bag text-sm"></i>
          <span class="hidden sm:inline">السلة</span>
          <span id="cart-badge" class="absolute -top-1.5 -right-1.5 bg-emerald-500 text-slate-950 w-4 h-4 rounded-full text-[9px] flex items-center justify-center font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- الهيرو والبحث والتصنيفات -->
  <section class="max-w-7xl mx-auto px-4 pt-6 pb-5 my-3 rounded-3xl text-center bg-slate-900/40 border border-slate-800/80 mx-4 md:mx-auto w-[calc(100%-2rem)] shadow-lg">
    <h2 class="text-xl md:text-3xl font-black mb-2 text-white">روائح تخلد حضورك الراقي</h2>
    <p class="text-slate-400 text-xs max-w-md mx-auto mb-4">اختار عطرك المفضّل وأتمم طلبك بكل سهولة ويسر.</p>
    
    <div class="max-w-md mx-auto relative mb-4">
      <span class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400"><i class="fas fa-search text-xs"></i></span>
      <input type="text" id="search-input" oninput="handleSearch()" placeholder="ابحث عن اسم العطر..." class="w-full bg-slate-800 border border-slate-700 rounded-xl py-2.5 pr-11 pl-4 text-xs text-white focus:outline-none focus:border-primary transition shadow-inner">
    </div>

    <!-- أزرار التصنيفات التلقائية -->
    <div id="category-filters" class="flex items-center gap-2 overflow-x-auto pb-1 hide-scrollbar justify-start sm:justify-center text-xs font-bold">
      <button onclick="filterByCategory('الكل')" id="cat-الكل" class="cat-filter-btn tap-effect whitespace-nowrap bg-primary text-slate-950 px-3.5 py-2 rounded-xl transition shadow">✨ الكل</button>
    </div>
  </section>

  <!-- عرض المنتجات -->
  <main class="max-w-7xl mx-auto px-4 py-4 flex-grow w-full">
    <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-16 text-slate-400">
        <i class="fas fa-spinner fa-spin text-3xl text-primary mb-2"></i>
        <p class="text-xs">جاري جلب المنتجات...</p>
      </div>
    </div>
  </main>

  <!-- سلة المشتريات (Drawer) -->
  <div id="cart-drawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end transition-opacity" onclick="toggleCartModal()">
    <div class="w-full max-w-md bg-slate-900 border-r border-slate-800 h-full p-5 flex flex-col justify-between shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
          <h3 class="text-sm font-black text-white flex items-center gap-1.5"><i class="fas fa-shopping-bag text-primary"></i> سلة المشتريات</h3>
          <button onclick="toggleCartModal()" class="text-slate-400 hover:text-white w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
        </div>
        <div id="cart-items-box" class="space-y-2.5 mb-4">
          <p class="text-center text-slate-500 text-xs py-8">السلة فارغة حالياً</p>
        </div>
      </div>
      <div class="border-t border-slate-800 pt-3 space-y-2.5">
        <div class="flex justify-between items-center text-sm font-bold">
          <span class="text-slate-300">المجموع الكلي:</span>
          <span id="cart-total-price" class="text-primary text-base font-black">0.00 د.أ</span>
        </div>
        <input type="text" id="order-name" placeholder="الاسم الكريم" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-primary">
        <input type="tel" id="order-phone" placeholder="رقم الهاتف (07XXXXXXXX)" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-primary">
        <select id="order-delivery" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-xs text-white focus:outline-none focus:border-primary">
          <option value="استلام من المحل">استلام مباشر من المحل</option>
          <option value="توصيل ضمن العاصمة">توصيل ضمن العاصمة</option>
          <option value="توصيل المحافظات">توصيل لباقي المحافظات</option>
        </select>
        <button onclick="sendWhatsAppOrder()" class="tap-effect w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black py-3 rounded-xl text-xs flex items-center justify-center gap-2 shadow">
          <i class="fab fa-whatsapp text-base"></i> إرسال الطلب للواتساب
        </button>
      </div>
    </div>
  </div>

  <!-- قائمة المفضلة (Drawer) -->
  <div id="wishlist-drawer" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end transition-opacity" onclick="toggleWishlistModal()">
    <div class="w-full max-w-md bg-slate-900 border-r border-slate-800 h-full p-5 flex flex-col justify-between shadow-2xl overflow-y-auto" onclick="event.stopPropagation()">
      <div>
        <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-3">
          <h3 class="text-sm font-black text-white flex items-center gap-1.5"><i class="fas fa-heart text-rose-500"></i> المفضلة</h3>
          <button onclick="toggleWishlistModal()" class="text-slate-400 hover:text-white w-7 h-7 rounded-full bg-slate-800 flex items-center justify-center text-xs"><i class="fas fa-times"></i></button>
        </div>
        <div id="wishlist-items-box" class="space-y-2.5">
          <p class="text-center text-slate-500 text-xs py-8">المفضلة فارغة</p>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-slate-950 border-t border-slate-800 py-3 text-center text-[11px] text-slate-500">
    <p>جميع الحقوق محفوظة © إكسير العطور 2026</p>
  </footer>

  <!-- محرك التطبيق البرمجي النظيف -->
  <script>
    let appProducts = [];
    let appCategories = ['الكل'];
    let activeCategory = 'الكل';
    let appCart = JSON.parse(localStorage.getItem('shop_cart')) || [];
    let appWishlist = JSON.parse(localStorage.getItem('shop_wishlist')) || [];

    function initStore() {
      document.getElementById('store-title').innerText = STORE_CONFIG.name;
      
      Papa.parse(STORE_CONFIG.csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(res) {
          const rows = res.data;
          if (!rows || rows.length === 0) {
            document.getElementById('products-grid').innerHTML = `<div class="col-span-full text-center py-16 text-amber-500 text-xs font-bold">لا توجد منتجات مسجلة في الجدول حالياً.</div>`;
            return;
          }

          appProducts = [];
          const catSet = new Set(['الكل']);

          rows.forEach((row, idx) => {
            const clean = {};
            Object.keys(row).forEach(k => {
              clean[k.replace(/^\ufeff/, '').trim().toLowerCase()] = row[k];
            });

            const title = clean['title'] || clean['اسم المنتج'] || '';
            const price = clean['price'] || clean['السعر'] || '0';
            const image = clean['image'] || clean['الصورة'] || 'https://images.unsplash.com/photo-1523293182086-7651a899d37f?w=500';
            const desc = clean['description'] || clean['الوصف'] || '';
            const cat = clean['category'] || clean['التصنيف'] || 'عطور';

            if (!title) return;

            appProducts.push({
              id: idx,
              title: title.trim(),
              price: parseFloat(price) || 0,
              image: image.trim(),
              description: desc.trim(),
              category: cat.trim()
            });

            catSet.add(cat.trim());
          });

          appCategories = Array.from(catSet);
          buildCategoryButtons();
          renderProducts(appProducts);
          syncUIState();
        },
        error: function() {
          document.getElementById('products-grid').innerHTML = `<div class="col-span-full text-center py-16 text-rose-500 text-xs font-bold">تعذر الاتصال بملف البيانات. تأكد من إعدادات الرابط.</div>`;
        }
      });
    }

    function buildCategoryButtons() {
      const box = document.getElementById('category-filters');
      box.innerHTML = '';
      appCategories.forEach(cat => {
        const isActive = cat === activeCategory;
        box.innerHTML += `
          <button onclick="filterByCategory('${cat}')" id="cat-${cat}" class="cat-filter-btn tap-effect whitespace-nowrap ${isActive ? 'bg-primary text-slate-950 font-black shadow' : 'bg-slate-800 text-slate-300 border border-slate-700 font-bold'} px-3.5 py-2 rounded-xl transition text-xs">${cat === 'الكل' ? '✨ الكل' : cat}</button>
        `;
      });
    }

    function filterByCategory(cat) {
      activeCategory = cat;
      buildCategoryButtons();
      applyFilters();
    }

    function handleSearch() {
      applyFilters();
    }

    function applyFilters() {
      const q = document.getElementById('search-input').value.toLowerCase().trim();
      let list = appProducts;

      if (activeCategory !== 'الكل') {
        list = list.filter(p => p.category.toLowerCase() === activeCategory.toLowerCase());
      }

      if (q !== '') {
        list = list.filter(p => p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q));
      }

      renderProducts(list);
    }

    function renderProducts(list) {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-xs">لا توجد عطور مطابقة لبحثك.</div>`;
        return;
      }

      list.forEach(p => {
        const isFav = appWishlist.some(w => w.id === p.id);
        grid.innerHTML += `
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 flex flex-col justify-between transition-card relative shadow-md">
            <button onclick="toggleWishlist(${p.id})" class="absolute top-2.5 left-2.5 z-10 w-7 h-7 rounded-full bg-slate-950/70 backdrop-blur border border-slate-800 flex items-center justify-center text-xs transition ${isFav ? 'text-rose-500' : 'text-slate-400 hover:text-white'}">
              <i class="fas fa-heart"></i>
            </button>
            <div>
              <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-primary/15 text-primary border border-primary/30 inline-block mb-2">${p.category}</span>
              <div class="h-40 rounded-xl bg-slate-950 overflow-hidden mb-2.5 border border-slate-800 flex items-center justify-center">
                <img src="${p.image}" alt="${p.title}" class="w-full h-full object-cover">
              </div>
              <h3 class="font-bold text-xs text-white mb-1 line-clamp-1">${p.title}</h3>
              <p class="text-[11px] text-slate-300 leading-relaxed mb-3 line-clamp-2">${p.description}</p>
            </div>
            <div>
              <div class="text-sm font-black text-primary mb-2">${p.price} <span class="text-[10px] text-slate-400 font-normal">${STORE_CONFIG.currency}</span></div>
              <button onclick="addToCart(${p.id})" class="tap-effect w-full bg-primary hover:bg-primaryDark text-slate-950 font-black py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
                <i class="fas fa-cart-plus"></i> أضف للسلة
              </button>
            </div>
          </div>`;
      });
    }

    // إدارة السلة
    function toggleCartModal() {
      document.getElementById('cart-drawer').classList.toggle('hidden');
    }

    function addToCart(id) {
      const p = appProducts.find(x => x.id === id);
      const exist = appCart.find(x => x.id === id);
      if (exist) exist.qty++;
      else appCart.push({ ...p, qty: 1 });

      persistData();
      syncUIState();
      toggleCartModal();
    }

    function changeQty(id, delta) {
      const item = appCart.find(x => x.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) appCart = appCart.filter(x => x.id !== id);
      persistData();
      syncUIState();
    }

    // إدارة المفضلة
    function toggleWishlistModal() {
      document.getElementById('wishlist-drawer').classList.toggle('hidden');
    }

    function toggleWishlist(id) {
      const p = appProducts.find(x => x.id === id);
      const idx = appWishlist.findIndex(w => w.id === id);
      if (idx > -1) appWishlist.splice(idx, 1);
      else appWishlist.push(p);

      persistData();
      syncUIState();
      applyFilters();
    }

    function persistData() {
      localStorage.setItem('shop_cart', JSON.stringify(appCart));
      localStorage.setItem('shop_wishlist', JSON.stringify(appWishlist));
    }

    function syncUIState() {
      // شارات الهيدر
      const cartBadge = document.getElementById('cart-badge');
      const wishBadge = document.getElementById('wishlist-badge');
      
      const totalCartCount = appCart.reduce((s, i) => s + i.qty, 0);
      cartBadge.innerText = totalCartCount;

      if (appWishlist.length > 0) {
        wishBadge.innerText = appWishlist.length;
        wishBadge.classList.remove('hidden');
      } else {
        wishBadge.classList.add('hidden');
      }

      // صندوق السلة
      const cartBox = document.getElementById('cart-items-box');
      const totalBox = document.getElementById('cart-total-price');

      if (appCart.length === 0) {
        cartBox.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">السلة فارغة حالياً</p>`;
        totalBox.innerText = `0.00 ${STORE_CONFIG.currency}`;
      } else {
        cartBox.innerHTML = '';
        let sum = 0;
        appCart.forEach(i => {
          sum += i.price * i.qty;
          cartBox.innerHTML += `
            <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs gap-2">
              <div class="flex items-center gap-2 flex-1">
                <img src="${i.image}" class="w-9 h-9 rounded-lg object-cover">
                <div>
                  <h5 class="font-bold text-white line-clamp-1">${i.title}</h5>
                  <p class="text-primary font-bold">${i.price} ${STORE_CONFIG.currency}</p>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="changeQty(${i.id}, -1)" class="w-5 h-5 bg-slate-800 text-white rounded flex items-center justify-center font-bold text-xs">-</button>
                <span class="font-black w-4 text-center text-xs">${i.qty}</span>
                <button onclick="changeQty(${i.id}, 1)" class="w-5 h-5 bg-slate-800 text-white rounded flex items-center justify-center font-bold text-xs">+</button>
              </div>
            </div>`;
        });
        totalBox.innerText = `${sum.toFixed(2)} ${STORE_CONFIG.currency}`;
      }

      // صندوق المفضلة
      const wishBox = document.getElementById('wishlist-items-box');
      if (appWishlist.length === 0) {
        wishBox.innerHTML = `<p class="text-center text-slate-500 text-xs py-8">المفضلة فارغة</p>`;
      } else {
        wishBox.innerHTML = '';
        appWishlist.forEach(i => {
          wishBox.innerHTML += `
            <div class="flex items-center justify-between bg-slate-950 p-2 rounded-xl border border-slate-800 text-xs gap-2">
              <div class="flex items-center gap-2 flex-1">
                <img src="${i.image}" class="w-9 h-9 rounded-lg object-cover">
                <div>
                  <h5 class="font-bold text-white line-clamp-1">${i.title}</h5>
                  <p class="text-primary font-bold">${i.price} ${STORE_CONFIG.currency}</p>
                </div>
              </div>
              <button onclick="addToCart(${i.id}); toggleWishlistModal(); toggleCartModal();" class="bg-primary text-slate-950 font-bold px-2.5 py-1 rounded-lg text-xs">شراء</button>
            </div>`;
        });
      }
    }

    function sendWhatsAppOrder() {
      if (appCart.length === 0) { alert("السلة فارغة!"); return; }
      const name = document.getElementById('order-name').value.trim();
      const phone = document.getElementById('order-phone').value.trim();
      const delivery = document.getElementById('order-delivery').value;

      if (!name || !phone) { alert("الرجاء إدخال الاسم ورقم الهاتف لإتمام الطلب."); return; }

      let msg = `طلب جديد من المتجر 👑%0A- الاسم: ${name}%0A- الهاتف: ${phone}%0A- طريقة الاستلام: ${delivery}%0A------------------%0Aالمنتجات المطلوبة:%0A`;
      let total = 0;

      appCart.forEach((i, idx) => {
        const sub = i.price * i.qty;
        total += sub;
        msg += `${idx + 1}. ${i.title} (الكمية: ${i.qty}) - ${sub} ${STORE_CONFIG.currency}%0A`;
      });

      msg += `------------------%0Aالمجموع الكلي: ${total.toFixed(2)} ${STORE_CONFIG.currency}`;

      window.open(`https://wa.me/${STORE_CONFIG.whatsapp}?text=${msg}`, '_blank');
    }

    window.addEventListener('DOMContentLoaded', initStore);
  </script>
</body>
</html>
